<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musik</title>
<style>
  * { box-sizing: border-box; }
  :root {
    color-scheme: light dark;
    --tile-surface: var(--card-color, Canvas);
    --tile-text: var(--content-color, CanvasText);
    --tile-accent: var(--accent-color, Highlight);
    --tile-border: color-mix(in srgb, var(--tile-text) 30%, transparent);
    background-color: var(--tile-surface);
    color: var(--tile-text);
  }
  body {
    font: 1rem system-ui, sans-serif;
    margin: 0;
    min-height: 100vh;
    padding: 2.65rem .65rem .65rem;
    background-color: var(--tile-surface);
  }
  main { padding: .65rem; }
  h3 { margin: 0 0 .5rem; }
  section, form, details { margin-bottom: .7rem; }
  details { border: 1px solid var(--tile-border); border-radius: .45rem; padding: .55rem; }
  summary { cursor: pointer; overflow-wrap: anywhere; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; margin: .45rem 0; }
  label.choice { display: block; padding: .2rem 0; }
  input, button, select {
    font: inherit;
    color: inherit;
    background: var(--tile-surface);
    border: 1px solid var(--tile-border);
    border-radius: .35rem;
    padding: .35rem .5rem;
  }
  input[type=search] { flex: 1 1 9rem; min-width: 0; }
  input[type=checkbox] { accent-color: var(--tile-accent); }
  button {
    cursor: pointer;
    border-color: var(--tile-accent);
    background: color-mix(in srgb, var(--tile-accent) 15%, var(--tile-surface));
  }
  :focus-visible { outline: 2px solid var(--tile-accent); outline-offset: 2px; }
  button:disabled { cursor: default; opacity: .55; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { border-bottom: 1px solid var(--tile-border); padding: .4rem 0; overflow-wrap: anywhere; }
  li small { display: block; }
  .result {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    align-items: start;
    gap: .5rem;
    padding: .3rem 0;
  }
  .result input { accent-color: var(--tile-accent); }
  .result-title { font-weight: 600; }
  button.result-title {
    padding: 0;
    border: 0;
    background: none;
    text-align: start;
    text-decoration: underline;
  }
  .result small:empty { display: none; }
  .result-group h4 { margin: .6rem 0 .15rem; }
  .result-group > button { margin-top: .35rem; }
  #resultActions {
    position: sticky;
    top: 0;
    z-index: 1;
    padding: .35rem 0;
    background: var(--tile-surface);
  }
  #notice { min-height: 1.25em; margin: .4rem 0; }
  #notice:empty { display: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main aria-label="Musik">
  <p id="notice" role="status">Verbindung wird geladen …</p>
  <div id="music" hidden>
    <section aria-label="Aktuelle Wiedergabe">
      <h3>Aktuelle Wiedergabe</h3>
      <ul id="outputs"></ul>
      <div class="row">
        <button type="button" data-command="previous">Zurück</button><button type="button" data-command="pause">Pause</button>
        <button type="button" data-command="resume">Weiter</button><button type="button" data-command="stop">Stopp</button>
        <button type="button" data-command="next">Nächster</button>
      </div>
    </section>
    <details id="sourcePanel">
      <summary id="sourceSummary">Quelle wählen</summary>
      <div id="sources"></div>
      <button id="saveSources" type="button">Quellen speichern</button>
    </details>
    <details id="targetPanel">
      <summary id="targetSummary">Ausgabe wählen</summary>
      <div class="row"><label for="system">System</label><select id="system"></select></div>
      <div id="targets"></div>
      <button id="saveTargets" type="button">Ausgabe speichern</button>
    </details>
    <form id="search" class="row">
      <input id="query" type="search" required maxlength="120" placeholder="Musik oder Sender suchen" aria-label="Suchbegriff">
      <select id="kind" aria-label="Suchen nach">
        <option value="all">Alles</option><option value="artist">Interpret</option><option value="album">Album</option>
        <option value="track">Titel</option><option value="station">Radiosender</option>
      </select>
      <button>Suchen</button>
    </form>
    <section id="resultsPanel" hidden aria-label="Suchergebnisse">
      <div class="row" id="navigation"></div>
      <div class="row" id="resultActions" hidden>
        <button type="button" id="playResult" disabled>Auswahl abspielen</button>
        <button type="button" id="shuffleResult" disabled>Zufällig abspielen</button>
      </div>
      <div id="results"></div>
    </section>
  </div>
  <button type="button" id="retry" hidden>Erneut verbinden</button>
</main>
<script>
'use strict';
const el = id => document.getElementById(id);
const resultKinds = [['album', 'Alben'], ['artist', 'Interpreten'], ['track', 'Titel'], ['station', 'Radiosender']];
const session = Math.random().toString(36).slice(2);
let sequence = 0, pending = null, busy = false, state = null, views = [], sourceBase = [];
let selectedResult = null;

function handleMessage(message) {
    if (typeof message === 'string') {
        try {
            message = JSON.parse(message);
        } catch {
            return;
        }
    }
    if (!pending || !message || message.request_id !== pending.id) return;
    const {resolve, reject, timer} = pending;
    pending = null;
    clearTimeout(timer);
    if (message.error) reject(new Error(message.error));
    else resolve(message.result);
}

function send(action, fields = {}) {
    return new Promise((resolve, reject) => {
        const id = session + '-' + (++sequence);
        const timer = setTimeout(() => {
            pending = null;
            reject(new Error('Keine Antwort vom Modul. Bitte Status prüfen.'));
        }, 26000);
        pending = {id, resolve, reject, timer};
        try {
            requestAction('Music', JSON.stringify({action, request_id: id, ...fields}));
        } catch (error) {
            clearTimeout(timer);
            pending = null;
            reject(error);
        }
    });
}

function notice(text) { el('notice').textContent = text; }

async function run(operation, showProgress = true) {
    if (busy) return;
    busy = true;
    el('retry').disabled = true;
    document.querySelector('main').setAttribute('aria-busy', 'true');
    if (showProgress) notice('Bitte warten …');
    try {
        await operation();
    } catch (error) {
        notice(error.message || 'Musikanfrage fehlgeschlagen.');
        if (!state) el('retry').hidden = false;
    } finally {
        busy = false;
        el('retry').disabled = false;
        document.querySelector('main').setAttribute('aria-busy', 'false');
    }
}

function button(text, action) {
    const control = document.createElement('button');
    control.type = 'button';
    control.textContent = text;
    control.addEventListener('click', action);
    return control;
}

function choices(container, rows, selected) {
    container.replaceChildren();
    for (const row of rows) {
        const label = document.createElement('label');
        label.className = 'choice';
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.value = row.id;
        input.checked = selected.includes(row.id);
        input.disabled = row.available === false;
        label.append(input, ' ' + row.name + (input.disabled ? ' · nicht erreichbar' : ''));
        container.append(label);
    }
}

function checked(id) {
    return [...el(id).querySelectorAll('input:checked:not(:disabled)')].map(input => input.value);
}

function systemFor(target) {
    if (target.provider === 'lms') return 'lms:' + target.server_url;
    if (target.provider === 'bose') return 'bose:' + target.id;
    return target.provider;
}

function renderTargets() {
    const systems = new Map();
    for (const target of state.targets) {
        const key = systemFor(target);
        const source = state.sources.find(item => item.provider === 'lms' && item.url === target.server_url);
        const label = {esp: 'Dieser ESP', sonos: 'Sonos', bose: target.name,
            lms: source ? 'LMS · ' + source.name : 'LMS · ' + target.name}[target.provider];
        systems.set(key, label || target.name);
    }
    el('system').replaceChildren(...[...systems].map(([id, label]) => new Option(label, id)));
    const last = state.targets.find(target => state.target_ids.includes(target.id));
    if (last) el('system').value = systemFor(last);
    drawTargetChoices();
}

function drawTargetChoices() {
    choices(el('targets'), state.targets.filter(target => systemFor(target) === el('system').value), state.target_ids);
}

function selectionLabel(rows, selected) {
    return selected.map(id => rows.find(row => row.id === id)?.name || 'Nicht verfügbar').join(' + ') || 'Bitte wählen';
}

function renderState(next) {
    state = next;
    el('sourceSummary').textContent = 'Quelle · ' + selectionLabel(state.sources, state.source_ids);
    el('targetSummary').textContent = 'Ausgabe · ' + selectionLabel(state.targets, state.target_ids);
    if (!el('sourcePanel').open) choices(el('sources'), state.sources, state.source_ids);
    if (!el('targetPanel').open) renderTargets();
    renderOutputs(state.outputs);
    el('music').hidden = !state.enabled;
    el('retry').hidden = state.enabled;
    el('retry').textContent = 'Status erneut laden';
}

function renderOutputs(outputs) {
    const list = el('outputs');
    list.replaceChildren();
    const labels = {playing: 'Spielt', buffering: 'Lädt', paused: 'Pausiert'};
    for (const item of outputs.filter(row => row.status_known && Object.hasOwn(labels, row.state))) {
        const row = document.createElement('li');
        row.textContent = [item.target_name, item.stale ? 'Zuletzt: ' + labels[item.state] : labels[item.state],
            item.station, item.title, item.artist, item.album, item.radio_text].filter(Boolean).join(' · ');
        list.append(row);
    }
    if (!list.children.length) {
        const row = document.createElement('li');
        row.textContent = 'Keine laufende Wiedergabe gemeldet.';
        list.append(row);
    }
}

async function connect(background = false) {
    try {
        const next = await send('state');
        const wasUnavailable = !state?.enabled;
        renderState(next);
        if (!background || wasUnavailable || !state.enabled) {
            notice(state.enabled ? '' : 'Musik zuerst im Webinterface des ESP einschalten.');
        }
    } catch (error) {
        state = null;
        el('music').hidden = true;
        el('retry').hidden = false;
        el('retry').textContent = 'Erneut verbinden';
        throw error;
    }
}

function play(item, shuffle) {
    run(async () => {
        if (!state.target_ids.length) {
            el('targetPanel').open = true;
            throw new Error('Bitte zuerst eine Ausgabe speichern.');
        }
        const result = await send('play', {id: item.id, kind: item.kind, source_id: item.source_id, shuffle,
            target_ids: state.target_ids});
        notice(result.message);
    });
}

function browse(item) {
    return {action: 'browse', id: item.id, kind: item.kind, source_id: item.source_id, title: item.title};
}

function canBrowse(item) {
    return item.kind === 'artist' || item.kind === 'album';
}

function appendResults(list, items) {
    for (const item of items) {
        const browsable = canBrowse(item);
        const row = document.createElement('li');
        row.className = 'result';
        const choice = document.createElement('input');
        choice.type = 'radio';
        choice.id = 'result-' + item.kind + '-' + list.children.length;
        choice.name = 'musicResult';
        choice.setAttribute('aria-label', item.title + ' auswählen');
        choice.addEventListener('change', () => {
            selectedResult = item;
            el('playResult').disabled = false;
            el('shuffleResult').disabled = !browsable;
        });

        const details = document.createElement('div');
        const title = browsable
            ? button(item.title, () => run(() => loadViews([...views, browse(item)])))
            : document.createElement('label');
        if (!browsable) {
            title.htmlFor = choice.id;
            title.textContent = item.title;
        }
        title.className = 'result-title';
        const info = document.createElement('small');
        info.textContent = [item.artist, item.album, item.source_name].filter(value => value && value !== item.title).join(' · ');
        details.append(title, info);
        row.append(choice, details);
        list.append(row);
    }
}

function sourcesForKind(sources, kind) {
    if (kind === 'all') return sources;
    return sources.filter(source => (source === 'radio') === (kind === 'station'));
}

async function requestResultPage(view, offset) {
    if (view.action === 'browse') {
        return send('browse', {id: view.id, kind: view.kind, source_id: view.source_id, offset});
    }
    const sources = sourcesForKind(view.source_ids, view.kind);
    if (!sources.length) throw new Error('Bitte zuerst eine passende Suchquelle wählen.');
    return send('search', {query: view.query, kind: view.kind, source_ids: sources, offset});
}

function resultNotice(page, hasItems) {
    const errors = page.source_errors.map(item => (item.source_name || item.source_id || 'Quelle') + ' · ' + item.error);
    notice([hasItems ? '' : 'Keine Treffer gefunden.', ...errors].filter(Boolean).join(' '));
}

function morePagesAvailable(page) {
    return page.nextOffset <= 10000 && (page.has_more || page.source_errors.length > 0);
}

function rememberPage(page, offset) {
    return {...page, nextOffset: page.source_errors.length ? offset : offset + page.page_size};
}

function renderResults(view) {
    const page = view.page;
    const overview = view.action === 'search' && view.kind === 'all';
    const focusedKind = view.action === 'browse' ? (view.kind === 'artist' ? 'album' : 'track') : view.kind;
    selectedResult = null;
    el('resultActions').hidden = page.results.length === 0;
    el('playResult').disabled = true;
    el('shuffleResult').disabled = true;
    const results = el('results');
    results.replaceChildren();
    for (const [kind, label] of resultKinds) {
        if (overview ? !sourcesForKind(view.source_ids, kind).length : kind !== focusedKind) continue;
        const group = document.createElement('section');
        group.className = 'result-group';
        const heading = document.createElement('h4');
        heading.textContent = label;
        const list = document.createElement('ul');
        appendResults(list, page.results.filter(item => item.kind === kind));
        const more = button('Mehr anzeigen', () => run(async () => {
            if (overview) {
                await loadViews([...views, {action: 'search', query: view.query, kind, source_ids: view.source_ids}]);
                return;
            }
            const offset = view.page.nextOffset;
            const next = rememberPage(await requestResultPage(view, offset), offset);
            const key = item => JSON.stringify([item.source_id, item.id]);
            const seen = new Set(view.page.results.map(key));
            const added = next.results.filter(item => {
                const id = key(item);
                if (item.kind !== kind || seen.has(id)) return false;
                seen.add(id);
                return true;
            });
            view.page = {...next, results: [...view.page.results, ...added]};
            appendResults(list, added);
            more.hidden = !morePagesAvailable(view.page);
            el('resultActions').hidden = !view.page.results.length;
            resultNotice(view.page, view.page.results.length > 0);
        }));
        more.setAttribute('aria-label', 'Mehr anzeigen: ' + label);
        more.hidden = !overview && !morePagesAvailable(page);
        group.append(heading, list, more);
        results.append(group);
    }
}

async function loadViews(nextViews) {
    const view = nextViews[nextViews.length - 1];
    if (!view.page) view.page = rememberPage(await requestResultPage(view, 0), 0);
    views = nextViews;
    el('resultsPanel').hidden = false;
    const nav = el('navigation');
    nav.replaceChildren();
    if (views.length > 1) nav.append(button(view.action === 'search' ? 'Zurück zur Übersicht' : 'Zurück zu den Treffern',
        () => run(() => loadViews(views.slice(0, -1)))));
    if (view.action === 'browse') {
        const heading = document.createElement('strong');
        heading.textContent = view.title;
        nav.append(heading, button('Abspielen', () => play(view, false)), button('Zufällig abspielen', () => play(view, true)));
    }
    renderResults(view);
    resultNotice(view.page, view.page.results.length > 0);
}

el('sourcePanel').addEventListener('toggle', () => {
    if (!el('sourcePanel').open || !state) return;
    sourceBase = [...state.source_ids];
    choices(el('sources'), state.sources, sourceBase);
});
el('targetPanel').addEventListener('toggle', () => {
    if (el('targetPanel').open && state) renderTargets();
});
el('system').addEventListener('change', drawTargetChoices);
el('saveSources').addEventListener('click', () => run(async () => {
    const next = await send('sources', {source_ids: checked('sources'), expected_sources: sourceBase});
    el('sourcePanel').open = false;
    renderState(next);
    notice('Quellen gespeichert.');
}));
el('saveTargets').addEventListener('click', () => run(async () => {
    const next = await send('targets', {target_ids: checked('targets')});
    el('targetPanel').open = false;
    renderState(next);
    notice('Ausgabe gespeichert.');
}));
el('search').addEventListener('submit', event => {
    event.preventDefault();
    run(async () => {
        if (!state.source_ids.length) {
            el('sourcePanel').open = true;
            throw new Error('Bitte zuerst eine Suchquelle speichern.');
        }
        const kind = state.source_ids.length === 1 && state.source_ids[0] === 'radio' ? 'station' : el('kind').value;
        await loadViews([{action: 'search', query: el('query').value.trim(), kind, source_ids: state.source_ids}]);
    });
});
for (const control of document.querySelectorAll('[data-command]')) {
    control.addEventListener('click', () => run(async () => {
        await send('control', {command: control.dataset.command});
        notice('');
    }, false));
}
el('playResult').addEventListener('click', () => {
    if (selectedResult) play(selectedResult, false);
});
el('shuffleResult').addEventListener('click', () => {
    if (selectedResult && canBrowse(selectedResult)) play(selectedResult, true);
});
el('retry').addEventListener('click', () => run(() => connect()));
const start = () => run(() => connect());
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
else start();
function pollPlayback() {
    if (!document.hidden) run(() => connect(true), false);
}
document.addEventListener('visibilitychange', pollPlayback);
setInterval(pollPlayback, 10000);
</script>
</body>
</html>
