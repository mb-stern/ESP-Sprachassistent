<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musik</title>
<style>
  * { box-sizing: border-box; }
  :root {
    color-scheme: light dark;
    --tile-surface: var(--card-color, Canvas);
    --tile-text: var(--content-color, CanvasText);
    --tile-accent: var(--accent-color, Highlight);
    --tile-border: color-mix(in srgb, var(--tile-text) 30%, transparent);
    background-color: var(--tile-surface);
    color: var(--tile-text);
  }
  body {
    font: 1rem system-ui, sans-serif;
    margin: 0;
    min-height: 100vh;
    padding: 2.65rem .65rem .65rem;
    background-color: var(--tile-surface);
  }
  main { padding: .65rem; }
  main.playback-open {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 3.3rem);
    height: calc(100dvh - 3.3rem);
    overflow: auto;
  }
  h3 { margin: 0 0 .5rem; }
  section, form, details { margin-bottom: .7rem; }
  details { border: 1px solid var(--tile-border); border-radius: .45rem; padding: .55rem; }
  summary { cursor: pointer; overflow-wrap: anywhere; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; margin: .45rem 0; }
  label.choice { display: block; padding: .2rem 0; }
  input, button, select {
    font: inherit;
    color: inherit;
    background: var(--tile-surface);
    border: 1px solid var(--tile-border);
    border-radius: .35rem;
    padding: .35rem .5rem;
  }
  input[type=search] { flex: 1 1 9rem; min-width: 0; }
  input[type=checkbox] { accent-color: var(--tile-accent); }
  button {
    cursor: pointer;
    border-color: var(--tile-accent);
    background: color-mix(in srgb, var(--tile-accent) 15%, var(--tile-surface));
  }
  :focus-visible { outline: 2px solid var(--tile-accent); outline-offset: 2px; }
  button:disabled { cursor: default; opacity: .55; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { border-bottom: 1px solid var(--tile-border); padding: .4rem 0; overflow-wrap: anywhere; }
  li small { display: block; }
  .playing { display: flex; align-items: center; gap: .65rem; }
  .room { margin-bottom: .45rem; padding: .5rem; border: 1px solid var(--tile-border); border-radius: .4rem; }
  .playing img { width: 3rem; height: 3rem; object-fit: cover; border-radius: .25rem; }
  .playing img.station-logo { width: 4.5rem; max-width: 20vw; object-fit: contain; }
  .cover-button { flex: none; padding: 0; border: 0; background: none; }
  .cover-button img { display: block; }
  #playbackDetail, #playbackDetailRoom { display: flex; flex: 1; flex-direction: column; margin: 0; }
  #playbackDetailBar { display: flex; align-items: center; justify-content: space-between; gap: .6rem; }
  #playbackDetailTitle { margin: 0; overflow-wrap: anywhere; }
  #closePlaybackDetail { flex: none; min-width: 2.5rem; min-height: 2.5rem; font-size: 1.45rem; line-height: 1; }
  .room-detail { display: flex; flex: 1; flex-direction: column; justify-content: center; gap: clamp(.65rem, 2vw, 1.5rem); padding: .6rem 0; }
  .room-detail-info { min-width: 0; overflow-wrap: anywhere; }
  .room-detail-summary { margin: 0 0 .55rem; }
  .detail-cover {
    align-self: center;
    width: 100%;
    height: min(45vh, 30rem);
    height: min(45dvh, 30rem);
    object-fit: contain;
    border-radius: .4rem;
  }
  @media (min-width: 520px) and (min-aspect-ratio: 1/1) {
    .room-detail { flex-direction: row; align-items: center; }
    .room-detail-info { flex: 1; }
    .detail-cover { flex: 0 1 50%; width: 50%; height: min(70vh, 36rem); height: min(70dvh, 36rem); }
  }
  .room-volume { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .2rem .4rem; margin: .35rem 0; }
  .room-volume input { grid-column: 1 / -1; margin: 0; padding: 0; accent-color: var(--tile-accent); }
  .result {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    align-items: start;
    gap: .5rem;
    padding: .3rem 0;
  }
  .result input { accent-color: var(--tile-accent); }
  .result-title { font-weight: 600; }
  button.result-title {
    padding: 0;
    border: 0;
    background: none;
    text-align: start;
    text-decoration: underline;
  }
  .result small:empty { display: none; }
  .result-group h4 { margin: .6rem 0 .15rem; }
  .result-group > button { margin-top: .35rem; }
  #resultActions {
    position: sticky;
    top: 0;
    z-index: 1;
    padding: .35rem 0;
    background: var(--tile-surface);
  }
  #notice { min-height: 1.25em; margin: .4rem 0; }
  #notice:empty { display: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main aria-label="Musik">
  <p id="notice" role="status">Verbindung wird geladen …</p>
  <div id="music" hidden>
    <section aria-label="Aktuelle Wiedergabe">
      <h3 id="playbackOverviewTitle" tabindex="-1">Aktuelle Wiedergabe</h3>
      <ul id="outputs"></ul>
      <details id="otherOutputsPanel" hidden><summary>Andere freigegebene Geräte</summary><ul id="otherOutputs"></ul></details>
    </section>
    <div id="musicSearch">
    <details id="sourcePanel">
      <summary id="sourceSummary">Quelle wählen</summary>
      <div id="sources"></div>
      <button id="saveSources" type="button">Quellen speichern</button>
    </details>
    <details id="targetPanel">
      <summary id="targetSummary">Ausgabe wählen</summary>
      <div class="row"><label for="system">System</label><select id="system"></select></div>
      <div id="targets"></div>
      <button id="saveTargets" type="button">Ausgabe speichern</button>
    </details>
    <form id="search" class="row">
      <input id="query" type="search" required maxlength="120" placeholder="Musik oder Sender suchen" aria-label="Suchbegriff">
      <select id="kind" aria-label="Suchen nach">
        <option value="all">Alles</option><option value="artist">Interpret</option><option value="album">Album</option>
        <option value="track">Titel</option><option value="station">Radiosender</option>
      </select>
      <button>Suchen</button>
    </form>
    <section id="resultsPanel" hidden aria-label="Suchergebnisse">
      <div class="row" id="navigation"></div>
      <div class="row" id="resultActions" hidden>
        <button type="button" id="playResult" disabled>Auswahl abspielen</button>
        <button type="button" id="shuffleResult" disabled>Zufällig abspielen</button>
      </div>
      <div id="results"></div>
    </section>
    </div>
  </div>
  <section id="playbackDetail" aria-labelledby="playbackDetailTitle" hidden>
    <div id="playbackDetailBar">
      <h3 id="playbackDetailTitle"></h3>
      <button type="button" id="closePlaybackDetail" aria-label="Detailansicht schliessen" title="Schliessen">×</button>
    </div>
    <div id="playbackDetailRoom"></div>
  </section>
  <button type="button" id="retry" hidden>Erneut verbinden</button>
</main>
<script>
'use strict';
const el = id => document.getElementById(id);
const resultKinds = [['album', 'Alben'], ['artist', 'Interpreten'], ['track', 'Titel'], ['station', 'Radiosender']];
const session = Math.random().toString(36).slice(2);
let sequence = 0, busy = false, state = null, views = [], sourceBase = [];
const pending = new Map();
const covers = new Map(), coverRetry = new Map();
let coverLoading = false, cardBusy = 0, sliderEditingUntil = 0, outputSignature = '';
let playbackRevision = 0, skipRefresh = false, preferredCover = '';
let playbackDetail = null;
let selectedResult = null;
const outputLabels = {playing: 'Spielt', buffering: 'Lädt', paused: 'Pausiert',
    stopped: 'Gestoppt', unavailable: 'Nicht erreichbar', error: 'Wiedergabefehler'};

function isOngoing(item) {
    return item.status_known && ['playing', 'buffering', 'paused'].includes(item.state);
}

function handleMessage(message) {
    if (typeof message === 'string') {
        try {
            message = JSON.parse(message);
        } catch {
            return;
        }
    }
    const reply = message && pending.get(message.request_id);
    if (!reply) return;
    const {resolve, reject, timer} = reply;
    pending.delete(message.request_id);
    clearTimeout(timer);
    if (message.error) reject(new Error(message.error));
    else resolve(message.result);
}

function send(action, fields = {}) {
    return new Promise((resolve, reject) => {
        const id = session + '-' + (++sequence);
        const timer = setTimeout(() => {
            pending.delete(id);
            reject(new Error('Keine Antwort vom Modul. Bitte Status prüfen.'));
        }, 26000);
        pending.set(id, {resolve, reject, timer});
        try {
            requestAction('Music', JSON.stringify({action, request_id: id, ...fields}));
        } catch (error) {
            clearTimeout(timer);
            pending.delete(id);
            reject(error);
        }
    });
}

function notice(text) { el('notice').textContent = text; }

async function run(operation, showProgress = true) {
    if (busy) return;
    busy = true;
    el('retry').disabled = true;
    document.querySelector('main').setAttribute('aria-busy', 'true');
    if (showProgress) notice('Bitte warten …');
    try {
        await operation();
    } catch (error) {
        notice(error.message || 'Musikanfrage fehlgeschlagen.');
        if (!state) el('retry').hidden = false;
    } finally {
        busy = false;
        el('retry').disabled = false;
        document.querySelector('main').setAttribute('aria-busy', 'false');
    }
}

function button(text, action) {
    const control = document.createElement('button');
    control.type = 'button';
    control.textContent = text;
    control.addEventListener('click', action);
    return control;
}

function choices(container, rows, selected) {
    container.replaceChildren();
    for (const row of rows) {
        const label = document.createElement('label');
        label.className = 'choice';
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.value = row.id;
        input.checked = selected.includes(row.id);
        input.disabled = row.available === false;
        label.append(input, ' ' + row.name + (input.disabled ? ' · nicht erreichbar' : ''));
        container.append(label);
    }
}

function checked(id) {
    return [...el(id).querySelectorAll('input:checked:not(:disabled)')].map(input => input.value);
}

function systemFor(target) {
    if (target.provider === 'lms') return 'lms:' + target.server_url;
    if (target.provider === 'bose') return 'bose:' + target.id;
    return target.provider;
}

function renderTargets() {
    const systems = new Map();
    for (const target of state.targets) {
        const key = systemFor(target);
        const source = state.sources.find(item => item.provider === 'lms' && item.url === target.server_url);
        const label = {esp: 'Dieser ESP', sonos: 'Sonos', bose: target.name,
            lms: source ? 'LMS · ' + source.name : 'LMS · ' + target.name}[target.provider];
        systems.set(key, label || target.name);
    }
    el('system').replaceChildren(...[...systems].map(([id, label]) => new Option(label, id)));
    const last = state.targets.find(target => state.target_ids.includes(target.id));
    if (last) el('system').value = systemFor(last);
    drawTargetChoices();
}

function drawTargetChoices() {
    choices(el('targets'), state.targets.filter(target => systemFor(target) === el('system').value), state.target_ids);
}

function selectionLabel(rows, selected) {
    return selected.map(id => rows.find(row => row.id === id)?.name || 'Nicht verfügbar').join(' + ') || 'Bitte wählen';
}

function renderState(next) {
    state = next;
    el('sourceSummary').textContent = 'Quelle · ' + selectionLabel(state.sources, state.source_ids);
    el('targetSummary').textContent = 'Ausgabe · ' + selectionLabel(state.targets, state.target_ids);
    if (!el('sourcePanel').open) choices(el('sources'), state.sources, state.source_ids);
    if (!el('targetPanel').open) renderTargets();
    renderOutputs(state.outputs);
    setTimeout(loadCover, 0);
    showPlaybackView();
    el('musicSearch').hidden = !state.enabled;
    el('retry').hidden = true;
    el('retry').textContent = 'Status erneut laden';
}

function showPlaybackView() {
    const expanded = !!state && !!playbackDetail;
    document.querySelector('main').classList.toggle('playback-open', expanded);
    el('music').hidden = !state || expanded;
    el('playbackDetail').hidden = !expanded;
}

function openPlaybackDetail(item, cover) {
    playbackDetail = {targetId: item.target_id, name: item.target_name, cover, scroll: window.scrollY};
    showPlaybackView();
    renderOutputs(state.outputs, true);
    el('closePlaybackDetail').focus();
}

function closePlaybackDetail() {
    if (!playbackDetail) return;
    const {targetId, scroll} = playbackDetail;
    playbackDetail = null;
    el('playbackDetailRoom').replaceChildren();
    showPlaybackView();
    if (!state) {
        el('retry').focus();
        return;
    }
    renderOutputs(state.outputs, true);
    const opener = [...el('outputs').querySelectorAll('.cover-button')].find(button => button.dataset.targetId === targetId);
    (opener || el('playbackOverviewTitle')).focus({preventScroll: true});
    window.scrollTo(0, scroll);
    setTimeout(loadCover, 0);
}

function coverFor(item) {
    return covers.get(item.cover) || (typeof item.cover === 'string' &&
        /^https:\/\/[a-z][a-z0-9.-]*\.[a-z]{2,}(?=[:/])/i.test(item.cover) ? item.cover : '');
}

function coverImage(src, label) {
    const image = document.createElement('img');
    image.alt = label;
    image.referrerPolicy = 'no-referrer';
    image.src = src;
    return image;
}

function roomDescription(item) {
    const label = outputLabels[item.state] || 'Status unbekannt';
    return [(item.stale && item.status_known ? 'Zuletzt: ' : '') + label,
        item.station, item.title, item.artist, item.album, item.radio_text].filter(Boolean).join(' · ');
}

function canControl(item) {
    return item.state !== 'unavailable' &&
        (item.allowed ?? state.targets.some(target => target.id === item.target_id));
}

function renderPlaybackDetail(item, cover) {
    const destination = el('playbackDetailRoom');
    const previousFocus = destination.contains(document.activeElement) && document.activeElement.getAttribute('aria-label');
    const name = item?.target_name || playbackDetail.name || 'Wiedergabeziel';
    el('playbackDetailTitle').textContent = name;
    const article = document.createElement('article');
    article.className = 'room-detail';
    if (cover) {
        const image = coverImage(cover, 'Cover · ' + name);
        image.className = 'detail-cover';
        image.addEventListener('error', () => image.remove(), {once: true});
        article.append(image);
    }
    const info = document.createElement('div');
    info.className = 'room-detail-info';
    const summary = document.createElement('p');
    summary.className = 'room-detail-summary';
    summary.textContent = item ? roomDescription(item) : 'Nicht erreichbar';
    info.append(summary);
    if (item && canControl(item)) appendRoomControls(info, item);
    article.append(info);
    destination.replaceChildren(article);
    if (previousFocus) {
        const control = [...destination.querySelectorAll('[aria-label]')].find(el => el.getAttribute('aria-label') === previousFocus);
        (control || el('closePlaybackDetail')).focus({preventScroll: true});
    }
}

function renderOutputs(outputs, force = false) {
    if (!force && (cardBusy || Date.now() < sliderEditingUntil)) return;
    if (playbackDetail) {
        const item = outputs.find(row => row.target_id === playbackDetail.targetId);
        const currentCover = item && coverFor(item);
        if (currentCover) playbackDetail.cover = currentCover;
        const cover = currentCover || (!item || ['stopped', 'unavailable'].includes(item.state) ? playbackDetail.cover : '');
        const signature = JSON.stringify([playbackDetail.targetId, item, !!cover]);
        if (force || signature !== outputSignature) {
            outputSignature = signature;
            renderPlaybackDetail(item, cover);
        }
        return;
    }
    const list = el('outputs');
    const other = el('otherOutputs');
    const signature = JSON.stringify(outputs.map(item => [item, covers.has(item.cover)]));
    if (!force && signature === outputSignature) return;
    outputSignature = signature;
    list.replaceChildren();
    other.replaceChildren();
    for (const item of outputs) {
        const ongoing = isOngoing(item);
        const allowed = item.allowed ?? state.targets.some(target => target.id === item.target_id);
        if (!ongoing && !allowed) continue;
        const row = document.createElement('li');
        row.className = 'room';
        const header = document.createElement('div');
        header.className = 'playing';
        const cover = coverFor(item);
        if (ongoing && cover) {
            const image = coverImage(cover, '');
            if (item.station) image.classList.add('station-logo');
            const coverElement = item.target_id ? button('', () => openPlaybackDetail(item, cover)) : image;
            if (coverElement !== image) {
                coverElement.className = 'cover-button';
                coverElement.dataset.targetId = item.target_id;
                coverElement.setAttribute('aria-label', 'Wiedergabe vergrössern · ' + (item.target_name || 'Wiedergabeziel'));
                coverElement.append(image);
            }
            image.addEventListener('error', () => coverElement.remove(), {once: true});
            header.append(coverElement);
        }
        const text = document.createElement('span');
        const name = document.createElement('strong');
        name.textContent = item.target_name || 'Wiedergabeziel';
        const description = document.createElement('small');
        description.textContent = roomDescription(item);
        text.append(name, description);
        header.append(text);
        row.append(header);
        if (canControl(item)) appendRoomControls(row, item);
        (ongoing ? list : other).append(row);
    }
    el('otherOutputsPanel').hidden = !other.children.length;
    if (!list.children.length) {
        const row = document.createElement('li');
        row.textContent = 'Keine laufende Wiedergabe gemeldet.';
        list.append(row);
    }
}

async function loadCover() {
    if (coverLoading || cardBusy || skipRefresh || !state || state.voice_active || document.hidden) return;
    const candidates = state.outputs.filter(item => (!playbackDetail || playbackDetail.targetId === item.target_id)
        && item.status_known && ['playing', 'paused'].includes(item.state)
        && typeof item.cover === 'string' && /^\/art\/[a-f0-9]{32}$/.test(item.cover)
        && !covers.has(item.cover) && (coverRetry.get(item.cover) || 0) < Date.now());
    const wanted = candidates.find(item => item.target_id === preferredCover) || candidates[0];
    if (!wanted) return;
    const ref = wanted.cover;
    coverLoading = true;
    try {
        const reply = await send('cover', {ref});
        if (typeof reply.image !== 'string' || !/^data:image\/(jpeg|png|gif|webp);base64,[A-Za-z0-9+/=]+$/.test(reply.image)) {
            throw new Error('Cover noch nicht verfügbar.');
        }
        if (covers.size >= 16) covers.delete(covers.keys().next().value);
        covers.set(ref, reply.image);
        if (state) renderOutputs(state.outputs);
    } catch {
        if (coverRetry.size >= 32) coverRetry.delete(coverRetry.keys().next().value);
        coverRetry.set(ref, Date.now() + 30000);
    } finally {
        coverLoading = false;
        setTimeout(loadCover, 150);
    }
}

async function refreshAfterSkip(previous, revision) {
    const media = ({title, artist, album, station, radio_text, cover}) =>
        JSON.stringify([title, artist, album, station, radio_text, cover]);
    const before = media(previous);
    const deadline = Date.now() + 3000;
    try {
        for (const delay of [250, 500, 900]) {
            await new Promise(resolve => setTimeout(resolve, delay));
            if (revision !== playbackRevision || !state || document.hidden || Date.now() > deadline) return;
            let reply;
            try {
                reply = await send('refresh', {target_id: previous.target_id});
            } catch {
                continue;
            }
            if (revision !== playbackRevision || !state) return;
            const item = reply?.outputs?.find(row => row.target_id === previous.target_id);
            if (!item?.status_known || item.stale === true ||
                (item.state === previous.state && media(item) === before) ||
                item.state === 'buffering') continue;
            state.outputs = state.outputs.map(row => row.target_id === item.target_id ? item : row);
            preferredCover = item.target_id;
            renderOutputs(state.outputs);
            setTimeout(loadCover, 0);
            return;
        }
    } finally {
        if (revision === playbackRevision) skipRefresh = false;
    }
}

function appendRoomControls(card, item) {
    const name = item.target_name || 'Wiedergabeziel';
    if (Number.isInteger(item.volume) && Number.isInteger(item.volume_max)) {
        const row = document.createElement('label');
        const slider = document.createElement('input');
        const value = document.createElement('output');
        row.className = 'room-volume';
        slider.type = 'range';
        slider.min = '0';
        slider.max = String(item.volume_max);
        slider.value = String(item.volume);
        slider.setAttribute('aria-label', 'Lautstärke ' + name);
        let confirmed = item.volume;
        const show = () => { value.textContent = slider.value + ' %'; };
        show();
        slider.addEventListener('input', show);
        slider.addEventListener('pointerdown', () => { sliderEditingUntil = Date.now() + 15000; });
        for (const event of ['pointerup', 'pointercancel', 'blur']) {
            slider.addEventListener(event, () => { sliderEditingUntil = 0; });
        }
        slider.addEventListener('change', async () => {
            cardBusy++;
            slider.disabled = true;
            try {
                const reply = await send('volume', {target_id: item.target_id, volume: Number(slider.value)});
                confirmed = reply.volume;
            } catch (error) {
                notice(error.message || 'Lautstärke konnte nicht geändert werden.');
            } finally {
                slider.value = String(confirmed);
                show();
                slider.disabled = false;
                cardBusy--;
                sliderEditingUntil = 0;
                outputSignature = '';
            }
        });
        row.append('Lautstärke', value, slider);
        card.append(row);
    }
    if (!item.status_known || !item.target_id) return;
    const group = document.createElement('div');
    group.className = 'row';
    group.setAttribute('role', 'group');
    group.setAttribute('aria-label', item.grouped ? 'Wiedergabesteuerung für die Gruppe von ' + name : 'Wiedergabesteuerung ' + name);
    const playing = item.state === 'playing' || item.state === 'buffering';
    const canStart = item.target_id !== 'esp' || item.queue_count > 0;
    const commands = playing ? [['previous', 'Zurück'], ['pause', 'Pause'], ['stop', 'Stopp'], ['next', 'Nächster']]
        : item.state === 'paused' ? [['start', 'Weiter'], ['stop', 'Stopp']] : canStart ? [['start', 'Start']] : [];
    if (item.grouped && commands.length) {
        const scope = document.createElement('small');
        scope.textContent = 'Wiedergabe für die ganze Gruppe';
        card.append(scope);
    }
    for (const [command, label] of commands) {
        const control = button(label, async () => {
            if (cardBusy) return;
            const revision = ++playbackRevision;
            const skip = command === 'next' || command === 'previous';
            skipRefresh = false;
            cardBusy++;
            control.disabled = true;
            try {
                await send('transport', {target_id: item.target_id, command, grouped: item.grouped === true, legacy: item.card_transport !== true});
                skipRefresh = skip;
                notice('');
            } catch (error) {
                notice(error.message);
            } finally {
                cardBusy--;
                control.disabled = false;
                outputSignature = '';
                if (skipRefresh) void refreshAfterSkip(item, revision);
                else pollPlayback();
            }
        });
        control.setAttribute('aria-label', label + ' · ' + name);
        group.append(control);
    }
    if (commands.length) card.append(group);
}

async function connect(background = false) {
    const revision = playbackRevision;
    try {
        const next = await send('state');
        if (background && revision !== playbackRevision) return;
        const before = state?.enabled;
        renderState(next);
        if (!background || before !== state.enabled) {
            notice(state.enabled ? '' : 'Für die Musiksuche Musik im ESP-Webinterface aktivieren.');
        }
    } catch (error) {
        if (background && revision !== playbackRevision) return;
        state = null;
        outputSignature = '';
        showPlaybackView();
        el('retry').hidden = false;
        el('retry').textContent = 'Erneut verbinden';
        throw error;
    }
}

function play(item, shuffle) {
    run(async () => {
        if (!state.target_ids.length) {
            el('targetPanel').open = true;
            throw new Error('Bitte zuerst eine Ausgabe speichern.');
        }
        playbackRevision++;
        skipRefresh = false;
        const result = await send('play', {id: item.id, kind: item.kind, source_id: item.source_id, shuffle,
            target_ids: state.target_ids});
        notice(result.message);
    });
}

function browse(item) {
    return {action: 'browse', id: item.id, kind: item.kind, source_id: item.source_id, title: item.title};
}

function canBrowse(item) {
    return item.kind === 'artist' || item.kind === 'album';
}

function appendResults(list, items) {
    for (const item of items) {
        const browsable = canBrowse(item);
        const row = document.createElement('li');
        row.className = 'result';
        const choice = document.createElement('input');
        choice.type = 'radio';
        choice.id = 'result-' + item.kind + '-' + list.children.length;
        choice.name = 'musicResult';
        choice.setAttribute('aria-label', item.title + ' auswählen');
        choice.addEventListener('change', () => {
            selectedResult = item;
            el('playResult').disabled = false;
            el('shuffleResult').disabled = !browsable;
        });

        const details = document.createElement('div');
        const title = browsable
            ? button(item.title, () => run(() => loadViews([...views, browse(item)])))
            : document.createElement('label');
        if (!browsable) {
            title.htmlFor = choice.id;
            title.textContent = item.title;
        }
        title.className = 'result-title';
        const info = document.createElement('small');
        info.textContent = [item.artist, item.album, item.source_name].filter(value => value && value !== item.title).join(' · ');
        details.append(title, info);
        row.append(choice, details);
        list.append(row);
    }
}

function sourcesForKind(sources, kind) {
    if (kind === 'all') return sources;
    return sources.filter(source => (source === 'radio') === (kind === 'station'));
}

async function requestResultPage(view, offset) {
    if (view.action === 'browse') {
        return send('browse', {id: view.id, kind: view.kind, source_id: view.source_id, offset});
    }
    const sources = sourcesForKind(view.source_ids, view.kind);
    if (!sources.length) throw new Error('Bitte zuerst eine passende Suchquelle wählen.');
    return send('search', {query: view.query, kind: view.kind, source_ids: sources, offset});
}

function resultNotice(page, hasItems) {
    const errors = page.source_errors.map(item => (item.source_name || item.source_id || 'Quelle') + ' · ' + item.error);
    notice([hasItems ? '' : 'Keine Treffer gefunden.', ...errors].filter(Boolean).join(' '));
}

function morePagesAvailable(page) {
    return page.nextOffset <= 10000 && (page.has_more || page.source_errors.length > 0);
}

function rememberPage(page, offset) {
    return {...page, nextOffset: page.source_errors.length ? offset : offset + page.page_size};
}

function renderResults(view) {
    const page = view.page;
    const overview = view.action === 'search' && view.kind === 'all';
    const focusedKind = view.action === 'browse' ? (view.kind === 'artist' ? 'album' : 'track') : view.kind;
    selectedResult = null;
    el('resultActions').hidden = page.results.length === 0;
    el('playResult').disabled = true;
    el('shuffleResult').disabled = true;
    const results = el('results');
    results.replaceChildren();
    for (const [kind, label] of resultKinds) {
        if (overview ? !sourcesForKind(view.source_ids, kind).length : kind !== focusedKind) continue;
        const group = document.createElement('section');
        group.className = 'result-group';
        const heading = document.createElement('h4');
        heading.textContent = label;
        const list = document.createElement('ul');
        appendResults(list, page.results.filter(item => item.kind === kind));
        const more = button('Mehr anzeigen', () => run(async () => {
            if (overview) {
                await loadViews([...views, {action: 'search', query: view.query, kind, source_ids: view.source_ids}]);
                return;
            }
            const offset = view.page.nextOffset;
            const next = rememberPage(await requestResultPage(view, offset), offset);
            const key = item => JSON.stringify([item.source_id, item.id]);
            const seen = new Set(view.page.results.map(key));
            const added = next.results.filter(item => {
                const id = key(item);
                if (item.kind !== kind || seen.has(id)) return false;
                seen.add(id);
                return true;
            });
            view.page = {...next, results: [...view.page.results, ...added]};
            appendResults(list, added);
            more.hidden = !morePagesAvailable(view.page);
            el('resultActions').hidden = !view.page.results.length;
            resultNotice(view.page, view.page.results.length > 0);
        }));
        more.setAttribute('aria-label', 'Mehr anzeigen: ' + label);
        more.hidden = !overview && !morePagesAvailable(page);
        group.append(heading, list, more);
        results.append(group);
    }
}

async function loadViews(nextViews) {
    const view = nextViews[nextViews.length - 1];
    if (!view.page) view.page = rememberPage(await requestResultPage(view, 0), 0);
    views = nextViews;
    el('resultsPanel').hidden = false;
    const nav = el('navigation');
    nav.replaceChildren();
    if (views.length > 1) nav.append(button(view.action === 'search' ? 'Zurück zur Übersicht' : 'Zurück zu den Treffern',
        () => run(() => loadViews(views.slice(0, -1)))));
    if (view.action === 'browse') {
        const heading = document.createElement('strong');
        heading.textContent = view.title;
        nav.append(heading, button('Abspielen', () => play(view, false)), button('Zufällig abspielen', () => play(view, true)));
    }
    renderResults(view);
    resultNotice(view.page, view.page.results.length > 0);
}

el('sourcePanel').addEventListener('toggle', () => {
    if (!el('sourcePanel').open || !state) return;
    sourceBase = [...state.source_ids];
    choices(el('sources'), state.sources, sourceBase);
});
el('targetPanel').addEventListener('toggle', () => {
    if (el('targetPanel').open && state) renderTargets();
});
el('system').addEventListener('change', drawTargetChoices);
el('saveSources').addEventListener('click', () => run(async () => {
    const next = await send('sources', {source_ids: checked('sources'), expected_sources: sourceBase});
    el('sourcePanel').open = false;
    renderState(next);
    notice('Quellen gespeichert.');
}));
el('saveTargets').addEventListener('click', () => run(async () => {
    const next = await send('targets', {target_ids: checked('targets')});
    el('targetPanel').open = false;
    renderState(next);
    notice('Ausgabe gespeichert.');
}));
el('search').addEventListener('submit', event => {
    event.preventDefault();
    run(async () => {
        if (!state.source_ids.length) {
            el('sourcePanel').open = true;
            throw new Error('Bitte zuerst eine Suchquelle speichern.');
        }
        const kind = state.source_ids.length === 1 && state.source_ids[0] === 'radio' ? 'station' : el('kind').value;
        await loadViews([{action: 'search', query: el('query').value.trim(), kind, source_ids: state.source_ids}]);
    });
});
el('playResult').addEventListener('click', () => {
    if (selectedResult) play(selectedResult, false);
});
el('shuffleResult').addEventListener('click', () => {
    if (selectedResult && canBrowse(selectedResult)) play(selectedResult, true);
});
el('retry').addEventListener('click', () => run(() => connect()));
el('closePlaybackDetail').addEventListener('click', closePlaybackDetail);
document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && playbackDetail) closePlaybackDetail();
});
const start = () => run(() => connect());
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
else start();
function pollPlayback() {
    if (!document.hidden && !cardBusy && !skipRefresh) run(() => connect(true), false);
}
document.addEventListener('visibilitychange', pollPlayback);
setInterval(pollPlayback, 10000);
</script>
</body>
</html>
